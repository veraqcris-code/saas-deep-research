spring.application.name=saas-prompts

# Configuración de H2 en memoria (para desarrollo y pruebas)
spring.datasource.url=jdbc:h2:mem:saaspromptsdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuración de JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Consola H2 habilitada para desarrollo (accesible en /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuración de Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

server.port=8080